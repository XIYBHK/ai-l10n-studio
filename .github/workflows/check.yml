name: Check

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - name: Cache npm dependencies
        uses: actions/cache@v5
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-20-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20-
            ${{ runner.os }}-node-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Check changed-file Prettier formatting
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE"
            HEAD_SHA="$PR_HEAD"
          else
            BASE_SHA="$PUSH_BASE"
            HEAD_SHA="$PUSH_HEAD"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            if git rev-parse --verify "${HEAD_SHA}^" >/dev/null 2>&1; then
              BASE_SHA=$(git rev-parse "${HEAD_SHA}^")
            else
              BASE_SHA=$(git hash-object -w -t tree /dev/null)
            fi
          fi
          git diff --diff-filter=ACMR --name-only -z "$BASE_SHA" "$HEAD_SHA" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.md' '*.yml' '*.yaml' '*.css' '*.html' > "$RUNNER_TEMP/prettier-files"
          FILES=()
          while IFS= read -r -d '' file; do
            if [[ -f "$file" ]]; then FILES+=("$file"); fi
          done < "$RUNNER_TEMP/prettier-files"
          if (( ${#FILES[@]} )); then
            npx prettier --check "${FILES[@]}"
          fi

      - name: Check cargo fmt
        working-directory: ./src-tauri
        run: cargo fmt --check

      - name: Build frontend
        run: npm run build

      - name: Run frontend UI tests
        run: npm run test:run

      - name: Run tooling regression tests
        run: npm run test:scripts

      - name: Run Rust tests
        working-directory: ./src-tauri
        run: cargo test --quiet

      - name: Verify ts-rs generated types are in sync
        working-directory: ./src-tauri
        run: |
          cargo test --features ts-rs --quiet
          # ts-rs 写入 ../src/types/generated/；若仓库副本陈旧即失败
          cd ..
          git diff --exit-code -- src/types/generated/

      - name: Run Rust clippy
        working-directory: ./src-tauri
        run: cargo clippy --lib --bins --all-features -- -D warnings
